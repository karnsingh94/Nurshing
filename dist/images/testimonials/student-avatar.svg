<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="60" height="60">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="robeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Robe / Gown Shoulders -->
  <path d="M 22 92 C 22 75, 34 68, 50 68 C 66 68, 78 75, 78 92 Z" fill="url(#robeGrad)" />
  
  <!-- Shirt & Gown V-neck with Gold Border -->
  <path d="M 42 68 L 50 82 L 58 68 Z" fill="#ffffff" />
  <path d="M 46 68 L 50 80 L 54 68 Z" fill="#f59e0b" />
  <path d="M 48 70 L 50 85 L 52 70 Z" fill="#ef4444" />

  <!-- Neck -->
  <rect x="44" y="56" width="12" height="14" rx="4" fill="#fed7aa" />

  <!-- Head / Face -->
  <ellipse cx="50" cy="46" rx="15" ry="17" fill="#fed7aa" />
  <!-- Hair sides -->
  <path d="M 35 44 C 34 38, 38 32, 50 32 C 62 32, 66 38, 65 44 C 65 40, 62 36, 50 36 C 38 36, 35 40, 35 44 Z" fill="#1e293b" />
  <!-- Ears -->
  <circle cx="34" cy="46" r="3.5" fill="#fba979" />
  <circle cx="66" cy="46" r="3.5" fill="#fba979" />

  <!-- Graduation Cap (Mortarboard) -->
  <!-- Cap Skull Base -->
  <path d="M 38 36 C 38 30, 62 30, 62 36 Z" fill="#1e40af" />
  
  <!-- Diamond Top Cap -->
  <polygon points="50,14 78,25 50,36 22,25" fill="url(#capGrad)" />
  
  <!-- Center Cap Button -->
  <circle cx="50" cy="25" r="2.5" fill="#f59e0b" />
  
  <!-- Golden Tassel hanging to the left -->
  <path d="M 50 25 Q 40 28, 32 38 Q 30 46, 32 52" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="32" cy="53" r="2.5" fill="#d97706" />
</svg>
