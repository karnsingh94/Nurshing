<svg xmlns="http://www.w3.org/2000/svg" width="280" height="52" viewBox="0 0 280 52">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean White Rounded Container Badge -->
  <rect x="2" y="2" width="276" height="48" rx="12" fill="#ffffff" filter="url(#cardShadow)" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- Cyan/Blue Rounded Icon Square -->
  <g transform="translate(10, 9)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#0294cb" />
    <!-- White Graduation Cap Top Diamond -->
    <path d="M17 7 L28 12.5 L17 18 L6 12.5 Z" fill="#ffffff" />
    <!-- Cap Neck / Underneath Arch -->
    <path d="M10.5 15.5 V19 C10.5 22.5 13.5 24.5 17 24.5 C20.5 24.5 23.5 22.5 23.5 19 V15.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" />
    <!-- Cap Tassel Hanging Right -->
    <path d="M26 13.5 V21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <circle cx="26" cy="21.5" r="1.2" fill="#ffffff" />
  </g>

  <!-- Logo Brand Typography -->
  <text x="52" y="33" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.3px">
    <tspan fill="#111827">cits</tspan>
    <tspan fill="#0099cc" font-size="23" font-weight="900" font-style="italic"> A</tspan>
    <tspan fill="#111827">dmission</tspan>
    <tspan fill="#0099cc" font-size="20" font-weight="700">.com</tspan>
  </text>
</svg>
